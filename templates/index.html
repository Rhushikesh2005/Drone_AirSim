<!DOCTYPE html>
<html>
<head>
    <title>AeroBrain Mission Control</title>
    <style>
        body { background-color: #0b0f19; color: #00ffcc; font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0;}
        h1 { margin-top: 20px; text-shadow: 0 0 10px #00ffcc; }
        .hud-container { display: inline-block; border: 2px solid #00ffcc; padding: 10px; border-radius: 10px; margin-top: 20px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
        img { width: 640px; height: 480px; border: 1px solid #333; }
        .telemetry-panel { display: flex; justify-content: space-around; margin-top: 20px; width: 640px; margin-left: auto; margin-right: auto; }
        .box { border: 1px solid #00ffcc; padding: 15px; width: 45%; border-radius: 5px; background: rgba(0, 255, 204, 0.05); }
        .val { font-size: 24px; font-weight: bold; color: #fff; margin-top: 10px; text-shadow: 0 0 5px #fff; }
    </style>
</head>
<body>

    <h1>🚁 AeroBrain AI Mission Control</h1>
    
    <div class="hud-container">
        <img src="/video_feed" alt="Live Drone Camera">
    </div>

    <div class="telemetry-panel">
        <div class="box">
            <div>YAW (ROTATION)</div>
            <div class="val" id="yaw-val">WAITING...</div>
        </div>
        <div class="box">
            <div>PITCH (FORWARD/BACK)</div>
            <div class="val" id="pitch-val">WAITING...</div>
        </div>
    </div>

    <script>
        // Har 500ms mein AI commands server se mangwana
        setInterval(function() {
            fetch('/telemetry')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('yaw-val').innerText = data.yaw;
                    document.getElementById('pitch-val').innerText = data.pitch;
                });
        }, 500);
    </script>

</body>
</html>
